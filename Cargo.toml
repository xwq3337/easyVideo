[package]
name = "easydownvideo"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
m3u8-rs = "1"
aes = "0.8"
cbc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = "2"
sha2 = "0.10"
eframe = "0.30"
rfd = "0.15"
arboard = "3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
