<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyVideo 视频捕获</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17">
            <path d="M8 5.8v12.4L18.4 12 8 5.8Z" fill="currentColor"></path>
          </svg>
        </span>
        <div class="brand-copy">
          <h1>EasyVideo 视频捕获</h1>
          <div id="connection" class="connection" data-state="checking" title="">
            <span class="connection-dot" aria-hidden="true"></span>
            <span id="connectionText">正在连接…</span>
          </div>
        </div>
      </div>
      <a id="openOptions" class="icon-button" href="options.html" title="设置" aria-label="打开设置">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6Zm7.4 2.8c0-.5-.05-1-.13-1.47l2-1.56-1.9-3.3-2.36.95a7.4 7.4 0 0 0-2.55-1.47L14.1 7.5h-4.2l-.36-2.35a7.4 7.4 0 0 0-2.55 1.47l-2.36-.95-1.9 3.3 2 1.56a7.5 7.5 0 0 0 0 2.94l-2 1.56 1.9 3.3 2.36-.95a7.4 7.4 0 0 0 2.55 1.47l.36-2.35h4.2l.36 2.35a7.4 7.4 0 0 0 2.55-1.47l2.36.95 1.9-3.3-2-1.56c.08-.47.13-.97.13-1.47Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
    </header>

    <div id="tokenWarning" class="banner banner-warning hidden" role="alert">
      <span id="tokenWarningText">尚未配置访问令牌，下载前请先在设置中粘贴令牌。</span>
      <a id="warningOptions" href="options.html">去设置</a>
    </div>

    <section class="toolbar" aria-label="操作">
      <div class="toolbar-group">
        <button id="refreshButton" class="button button-secondary" type="button">刷新</button>
        <button id="clearButton" class="button button-secondary" type="button">清空</button>
      </div>
      <button id="downloadPageButton" class="button button-primary" type="button">下载当前页面</button>
    </section>

    <div id="actionStatus" class="action-status hidden" role="status" aria-live="polite"></div>

    <section class="capture-section" aria-labelledby="captureHeading">
      <div class="section-heading">
        <h2 id="captureHeading">捕获到的视频</h2>
        <span id="itemCount" class="item-count" aria-live="polite"></span>
      </div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <rect x="5" y="9" width="38" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="2.2"></rect>
            <path d="M20 17.5v13l11-6.5-11-6.5Z" fill="currentColor"></path>
          </svg>
        </div>
        <p class="empty-title">还没有捕获到视频，播放一会儿再刷新</p>
        <p class="empty-hint">扩展会自动记录 HLS 与常见视频文件</p>
      </div>

      <div id="itemList" class="item-list"></div>
    </section>

    <footer class="app-footer">
      <span id="footerPort">端口 27853</span>
      <span class="footer-dot" aria-hidden="true">·</span>
      <span>配合 easyVideo 客户端使用</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
